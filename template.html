<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qasim Rahman</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>

<div class="container">

    <div class="upper-section">
        <h1>Qasim Rahman</h1>
        <p>qasim.y.rahman@gmail.com</p>

        <p>
            <a href="https://www.linkedin.com/in/qasim-rahman-89176742b/" target="_blank">
                LinkedIn Profile
            </a>
        </p>

        <p>
            Short intro about me.
        </p>
    </div>

    <div class="lower-section">

        {% for project in projects %}
        <div class="project-card">

            <span class="year">{{ project.year }}</span>
            <h3>{{ project.title }}</h3>

            <div class="tags">
                {% for tag in project.tags %}
                    <span class="tag">{{ tag }}</span>
                {% endfor %}
            </div>

            <p>{{ project.description }}</p>

            <a class="github-button" href="{{ project.github }}" target="_blank">
                View on GitHub
            </a>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
